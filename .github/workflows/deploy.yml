name: CI / Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            test:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.test == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: backend-devops-interview-app:latest
          cache-from: type=gha,scope=backend-devops-interview-dev
          cache-to: type=gha,mode=max,scope=backend-devops-interview-dev

      - name: Prepare env
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d db

      - name: Run unit tests
        run: docker compose run --rm app uv run pytest

      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # SECRET_KEY / POSTGRES_PASSWORD are set once via `fly secrets set` (see
      # fly.toml / db/fly.toml) - not passed through this workflow.

      - name: Deploy database
        run: cd db && flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for database machine to be started
        run: |
          DB_MACHINE_ID=$(flyctl machines list --app backend-devops-interview-db-8675309 --json | jq -r '.[0].id')
          flyctl machines wait "$DB_MACHINE_ID" --app backend-devops-interview-db-8675309 --state started
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy app
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
